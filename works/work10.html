    <style type="text/tailwindcss">
        @layer utilities {
            .text-balance {
                text-wrap: balance;
            }
            .text-shadow {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            }
            .transition-transform {
                transition-property: transform;
                transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
                transition-duration: 300ms;
            }
            .hover-scale {
                @apply hover:scale-105 transition-transform duration-300;
            }
            .card-shadow {

    </style>

    <style>
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #bbb;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        /* 图片查看器样式 */
        .image-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 100;
            flex-direction: row;
        }

        .image-viewer.active {
            display: flex;
        }

        .viewer-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 60px 20px 20px 20px;
        }

        .viewer-main img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        .viewer-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            z-index: 10;
        }
        .viewer-nav:hover {
            background: rgba(255,255,255,0.4);
        }
        .viewer-prev { left: 20px; }
        .viewer-next { right: 20px; }
        .viewer-nav.disabled, .viewer-nav.disabled:hover {
            background: rgba(128,128,128,0.5) !important;
            opacity: 0.5;
            cursor: not-allowed;
        }

        .viewer-sidebar {
            width: 100px;
            background: rgba(0,0,0,0.4);
            padding: 50px 6px 6px 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .viewer-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 2px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.2s;
            border: 1px solid transparent;
            background: #333;
        }
        .viewer-thumb:hover {
            opacity: 0.85;
        }
        .viewer-thumb.active {
            opacity: 1;
            border-color: #0066ff;
            transform: scale(1.05);
        }

        .viewer-thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            flex-shrink: 0;
        }

        .image-viewer-close {
            position: absolute;
            top: 20px;
            right: 130px;
            color: white;
            font-size: 30px;
            cursor: pointer;
            z-index: 20;
        }

        /* Bento 照片统一白色边框（学习竞赛 + 综合实践全部生效） */
        .bento-wrap .photo-item img {
            border: 8px solid #ffffff;
            box-sizing: border-box;
            border-radius: 2px;
        }

        /* Bento Grid 作品网格 — 12列栅格基础；按张数分两种行高模板 */
        .bento-wrap {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 0.75rem;
        }
        /* 列占位 — 12等分中占 N 份 */
        .bento-col-3 { grid-column: span 3 / span 3; }
        .bento-col-4 { grid-column: span 4 / span 4; }
        .bento-col-5 { grid-column: span 5 / span 5; }
        .bento-col-7 { grid-column: span 7 / span 7; }
        /* 6 张版：2 行（上高下矮） */
        .bento-wrap-6 {
            grid-template-rows: 280px 220px;
        }
        /* 14 张版：5 行（两大段+底部两小图，视觉节奏与手绘一致） */
        .bento-wrap-14 {
            grid-template-rows: 280px 220px 280px 220px 240px;
        }
        /* 16 张版：6 行（两大段+底部四小图） */
        .bento-wrap-16 {
            grid-template-rows: 280px 220px 280px 220px 240px 200px;
        }

        .photo-item {
            overflow: hidden;
            border-radius: 0.5rem;
            cursor: pointer;
            position: relative;
            background: #f3f4f6;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .photo-item:hover img {
            transform: scale(1.05);
        }

        .photo-item .ph {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            background: repeating-linear-gradient(
                45deg,
                #f3f4f6,
                #f3f4f6 10px,
                #e5e7eb 10px,
                #e5e7eb 20px
            );
            font-size: 1.75rem;
        }

        /* 移动端响应式 */
        @media (max-width: 768px) {
            .bento-wrap {
                grid-template-columns: repeat(3, 1fr);
                gap: 0.5rem;
            }
            /* 6 张版：2 行等高 */
            .bento-wrap-6 {
                grid-template-rows: 180px 180px;
            }
            /* 14 张版：5 行（15格），最后一格空置 */
            .bento-wrap-14 {
                grid-template-rows: repeat(5, 180px);
            }
            /* 16 张版：6 行（18格），最后两行未满 */
            .bento-wrap-16 {
                grid-template-rows: repeat(6, 180px);
            }
            .bento-wrap .bento-col-3,
            .bento-wrap .bento-col-4,
            .bento-wrap .bento-col-5,
            .bento-wrap .bento-col-7 {
                grid-column: span 1 !important;
            }
        }

        /* 淡入动画 */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        .fade-in.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 禁止图片下载：禁止选中、禁止拖拽 */
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            pointer-events: auto;
        }
    </style>

    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 移动端菜单切换
            const menuToggle = document.getElementById('menu-toggle');
            const mobileMenu = document.getElementById('mobile-menu');

            menuToggle.addEventListener('click', function() {
                mobileMenu.classList.toggle('hidden');
            });

            // 导航栏滚动效果
            const navbar = document.getElementById('navbar');
            window.addEventListener('scroll', function() {
                if (window.scrollY > 50) {
                    navbar.classList.add('bg-white', 'shadow-md');
                    navbar.classList.remove('bg-opacity-95');
                } else {
                    navbar.classList.remove('shadow-md');
                    navbar.classList.add('bg-opacity-95');
                }
            });

            // 淡入动画
            const fadeElements = document.querySelectorAll('.fade-in');

            const fadeInOnScroll = function() {
                fadeElements.forEach(element => {
                    const elementTop = element.getBoundingClientRect().top;
                    const windowHeight = window.innerHeight;

                    if (elementTop < windowHeight - 100) {
                        element.classList.add('active');
                    }
                });
            };

            fadeInOnScroll();
            window.addEventListener('scroll', fadeInOnScroll);

            // 使用 GSAP 添加更复杂的动画
            if (typeof gsap !== 'undefined') {
                // 标题和简介动画
                gsap.from('section:first-of-type h1', {
                    opacity: 0,
                    y: 50,
                    duration: 1,
                    delay: 0.2
                });

                gsap.from('section:first-of-type .flex', {
                    opacity: 0,
                    y: 30,
                    duration: 1,
                    delay: 0.5
                });
            }
        });

        // ===== work10 标签切换：学习竞赛 / 综合实践 =====
        function showTenTab(cat) {
            // 1. 显示对应分类相册，隐藏其他
            const cats = ['xuexi', 'zonghe'];
            cats.forEach(function(c) {
                const el = document.getElementById('cat-' + c);
                if (!el) return;
                if (c === cat) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });
            // 2. 更新标签按钮样式（选中：黑底白字+黑边；未选中：白底灰边）
            cats.forEach(function(c) {
                const btn = document.getElementById('tab-' + c);
                if (!btn) return;
                if (c === cat) {
                    btn.classList.remove('bg-white', 'border-gray-300', 'hover:bg-gray-50');
                    btn.classList.add('bg-black', 'text-white', 'border-black', 'hover:opacity-90');
                } else {
                    btn.classList.remove('bg-black', 'text-white', 'border-black', 'hover:opacity-90');
                    btn.classList.add('bg-white', 'border-gray-300', 'hover:bg-gray-50');
                }
            });
        }

        // ===== 图片查看器 =====
        let viewerItems = [];
        let viewerIndex = 0;
        let viewerScale = 1;

        function openImageViewer(e) {
            const itemEl = e.target.closest('.photo-item');
            if (!itemEl) return;

            // 如果是占位符，提示用户
            if (itemEl.querySelector('.ph')) {
                alert('请将摄影图片替换到对应位置');
                return;
            }

            const container = itemEl.parentElement;
            const images = Array.from(container.querySelectorAll('img'));

            // 构建图片列表
            viewerItems = images.map(function(img) {
                return { type: 'image', src: img.src };
            });

            // 找到当前点击的图片索引
            const clickedImg = itemEl.querySelector('img');
            viewerIndex = clickedImg ? images.indexOf(clickedImg) : 0;
            if (viewerIndex < 0) viewerIndex = 0;

            const viewer = document.getElementById('image-viewer');
            const viewerImage = document.getElementById('viewer-image');
            const sidebar = document.getElementById('viewer-sidebar');

            // 初始化显示
            viewerImage.src = viewerItems[viewerIndex].src;
            viewerScale = 1;
            viewerImage.style.transform = 'scale(1)';

            // 构建缩略图侧边栏
            sidebar.innerHTML = '';
            viewerItems.forEach(function(item, i) {
                const wrap = document.createElement('div');
                wrap.className = 'viewer-thumb-wrap';

                const thumb = document.createElement('img');
                thumb.src = item.src;
                thumb.className = 'viewer-thumb';
                wrap.appendChild(thumb);

                if (i === viewerIndex) {
                    thumb.classList.add('active');
                }
                wrap.onclick = function() {
                    viewerIndex = i;
                    showViewerItem();
                };
                sidebar.appendChild(wrap);
            });

            viewer.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function showViewerItem() {
            const viewerImage = document.getElementById('viewer-image');
            const sidebar = document.getElementById('viewer-sidebar');
            const item = viewerItems[viewerIndex];

            viewerImage.src = item.src;
            viewerScale = 1;
            viewerImage.style.transform = 'scale(1)';

            // 更新缩略图高亮
            const thumbs = sidebar.querySelectorAll('.viewer-thumb');
            thumbs.forEach(function(thumb, i) {
                thumb.classList.toggle('active', i === viewerIndex);
            });
            // update nav button state
            const prevBtn = document.querySelector('.viewer-prev');
            const nextBtn = document.querySelector('.viewer-next');
            if (prevBtn) prevBtn.classList.toggle('disabled', viewerIndex === 0);
            if (nextBtn) nextBtn.classList.toggle('disabled', viewerIndex === viewerItems.length - 1);
        }

        function prevImage() {
            if (viewerIndex > 0) {
                viewerIndex--;
                showViewerItem();
            }
        }

        function nextImage() {
            if (viewerIndex < viewerItems.length - 1) {
                viewerIndex++;
                showViewerItem();
            }
        }

        function closeImageViewer() {
            const viewer = document.getElementById('image-viewer');
            viewer.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // 点击图片查看器背景关闭
        document.getElementById('image-viewer').addEventListener('click', function(e) {
            if (e.target === this) {
                closeImageViewer();
            }
        });

        // 键盘导航支持
        document.addEventListener('keydown', function(e) {
            const viewer = document.getElementById('image-viewer');
            if (viewer.classList.contains('active')) {
                if (e.key === 'Escape') {
                    closeImageViewer();
                } else if (e.key === 'ArrowLeft') {
                    prevImage();
                } else if (e.key === 'ArrowRight') {
                    nextImage();
                }
            }
        });

        // 鼠标滚轮缩放图片（0.5x ~ 3x）
        document.getElementById('image-viewer').addEventListener('wheel', function(e) {
            if (!this.classList.contains('active')) return;
            e.preventDefault();
            if (e.deltaY < 0) {
                viewerScale = Math.min(viewerScale + 0.1, 3);
            } else {
                viewerScale = Math.max(viewerScale - 0.1, 0.5);
            }
            document.getElementById('viewer-image').style.transform = 'scale(' + viewerScale + ')';
        }, { passive: false });
    </script>
    <!-- 禁止图片下载：右键菜单、拖拽、快捷键、开发者工具 -->
    <script>
    (function() {
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('dragstart', function(e) { e.preventDefault(); });
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); return false; }
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) { e.preventDefault(); return false; }
        });
        function setImgNotDraggable() {
            document.querySelectorAll('img').forEach(function(img) {
                img.setAttribute('draggable', 'false');
                img.setAttribute('oncontextmenu', 'return false');
                img.setAttribute('ondragstart', 'return false');
            });
        }
        setImgNotDraggable();
        var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                mutation.addedNodes.forEach(function(node) {
                    if (node.nodeType === 1) {
                        if (node.tagName === 'IMG') {
                            node.setAttribute('draggable', 'false');
                            node.setAttribute('oncontextmenu', 'return false');
                            node.setAttribute('ondragstart', 'return false');
                        }
                        node.querySelectorAll && node.querySelectorAll('img').forEach(function(img) {
                            img.setAttribute('draggable', 'false');
                            img.setAttribute('oncontextmenu', 'return false');
                            img.setAttribute('ondragstart', 'return false');
                        });
                    }
                });
            });
        });
        observer.observe(document.body, { childList: true, subtree: true });
    })();
    </script>
